[build-system]
requires = ["setuptools>=77.0.3", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "digital-toolbox"                    # use hyphen for the distribution name
version = "0.0.1"
description = "Collection of functions for my day to day work on a computer"
readme = "README.md"
requires-python = ">=3.11"                  # 3.14 is not released yet; use a real version
authors = [
    { name = "Andy Tunison", email = "andrew.e.tunison@gmail.com" }
]
license = { text = "MIT" }                  # or whatever you chose
dependencies = []                           # add runtime deps here if needed

[project.optional-dependencies]
dev = [
    "black",
    "ruff",
    "mypy",
    "pytest",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["digital_toolbox*"]

# Optional but nice
[tool.black]
line-length = 120

[tool.ruff]
line-length = 120
extend-exclude = ["sandbox*", "*.ipynb", "notebooks"]

[tool.mypy]
ignore_missing_imports = true